<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Kelas - SDIT Tihamah</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background-color: #f8fafc; 
      margin: 0; 
      padding: 16px; 
      color: #0f172a; 
    }

    /* Container Full Width untuk menghilangkan ruang kosong samping */
    .container { 
      width: 100%; 
      max-width: 100%; 
      margin: 0 auto; 
    }
    
    /* Header Full Width & Rata Tengah */
    header { 
      background: linear-gradient(135deg, #0d7015 0%, #05470b 100%); 
      color: white; 
      padding: 24px 20px; 
      border-radius: 8px; 
      margin-bottom: 16px; 
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      width: 100%;
    }
    
    .header-brand { 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      gap: 10px; 
    }
    .logo-sekolah { width: 70px; height: 70px; object-fit: contain; background-color: #ffffff; padding: 4px; border-radius: 50%; }
    header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: 0.9; }
    
    /* Card Melebar Penuh */
    .card { 
      background: white; 
      padding: 24px; 
      border-radius: 8px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
      margin-bottom: 16px; 
      border: 1px solid #cbd5e1; 
      width: 100%;
    }
    
    .card h2 { 
      margin-top: 0; 
      font-size: 17px; 
      color: #0d7015; 
      border-bottom: 4px solid #0d7015; 
      padding-bottom: 10px; 
      margin-bottom: 20px;
    }
    
    /* Grid Form Melebar Mengisi Ruang */
    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 16px; 
    }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input, select { 
      padding: 10px 12px; 
      border: 1px solid #cbd5e1; 
      border-radius: 6px; 
      font-size: 14px; 
      width: 100%;
    }
    
    .btn { 
      background: #0d7015; 
      color: white; 
      padding: 12px 24px; 
      border: none; 
      border-radius: 6px; 
      font-weight: 600; 
      font-size: 14px;
      cursor: pointer; 
      margin-top: 16px; 
      transition: background 0.2s;
    }
    .btn:hover { background: #0a5a11; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    
    /* Pembungkus Tabel Lebar Maksimal */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    table { 
      width: 100%; 
      min-width: 1000px; 
      border-collapse: collapse; 
      font-size: 13px; 
    }
    th { 
      background-color: #0d7015; 
      color: white; 
      text-align: left; 
      padding: 12px 10px; 
      white-space: nowrap; 
    }
    td { 
      padding: 10px; 
      border-bottom: 1px solid #e2e8f0; 
      white-space: nowrap; 
    }
    tr:nth-child(even) { background-color: #f8fafc; }
    .col-center { text-align: center; }
    
    #statusForm { margin-top: 12px; font-weight: bold; }
    #loading { font-style: italic; color: #64748b; margin-top: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-brand">
      <img src="LOGO SDIT 2023.png" alt="Logo SDIT Tihamah" class="logo-sekolah">
      <div>
        <h1>DATA KELAS SDIT TIHAMAH</h1>
        <p>Sistem Input & Integrasi Data Google Sheets</p>
      </div>
    </div>
  </header>

  <div class="card">
    <h2>Input Data Kelas</h2>
    <form id="formKelas">
      <div class="form-grid">
        <div class="form-group">
          <label>Nama Kelas</label>
          <input type="text" name="namaKelas" placeholder="Misal: Kelas 1A" required>
        </div>
        <div class="form-group">
          <label>Tingkat</label>
          <select name="tingkat" required>
            <option value="Tingkat 1">Tingkat 1</option>
            <option value="Tingkat 2">Tingkat 2</option>
            <option value="Tingkat 3">Tingkat 3</option>
            <option value="Tingkat 4">Tingkat 4</option>
            <option value="Tingkat 5">Tingkat 5</option>
            <option value="Tingkat 6">Tingkat 6</option>
          </select>
        </div>
        <div class="form-group">
          <label>Wali Kelas</label>
          <input type="text" name="waliKelas" required>
        </div>
        <div class="form-group">
          <label>Guru PJOK</label>
          <input type="text" name="guruPJOK" required>
        </div>
        <div class="form-group">
          <label>Guru PAI</label>
          <input type="text" name="guruPAI" required>
        </div>
        <div class="form-group">
          <label>Guru Bahasa Inggris</label>
          <input type="text" name="guruInggris" required>
        </div>
        <div class="form-group">
          <label>Jumlah Siswa Laki-laki (L)</label>
          <input type="number" name="jumlahL" min="0" required>
        </div>
        <div class="form-group">
          <label>Jumlah Siswa Perempuan (P)</label>
          <input type="number" name="jumlahP" min="0" required>
        </div>
        <div class="form-group">
          <label>Ruang Kelas</label>
          <input type="text" name="ruangKelas" placeholder="Misal: Gedung A - R.101" required>
        </div>
      </div>
      <button type="submit" id="btnSubmit" class="btn">Simpan ke Google Sheets</button>
    </form>
    <div id="statusForm"></div>
  </div>

  <div class="card">
    <h2>Daftar Data Kelas dari Google Sheets</h2>
    <div id="loading">Memuat data dari Google Sheets...</div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Kelas</th>
            <th>Tingkat</th>
            <th>Wali Kelas</th>
            <th>Guru PJOK</th>
            <th>Guru PAI</th>
            <th>Guru Bahasa Inggris</th>
            <th class="col-center">L</th>
            <th class="col-center">P</th>
            <th class="col-center">Total</th>
            <th>Ruang Kelas</th>
          </tr>
        </thead>
        <tbody id="tabelBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxHlp87WFq667w8y76EIIjJsKAWL63bXKJhm7GZcJSEEGFZn61EgW9eghLWos5JYic/exec";

  document.getElementById("formKelas").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const btn = document.getElementById("btnSubmit");
    const statusDiv = document.getElementById("statusForm");
    
    btn.disabled = true;
    statusDiv.style.color = "#64748b";
    statusDiv.innerText = "Menyimpan data...";

    const formData = new FormData(this);
    const dataObj = Object.fromEntries(formData.entries());

    fetch(URL_APPS_SCRIPT, {
      method: "POST",
      body: JSON.stringify(dataObj)
    })
    .then(res => res.json())
    .then(response => {
      btn.disabled = false;
      if (response.status === "success") {
        statusDiv.style.color = "green";
        statusDiv.innerText = response.message;
        document.getElementById("formKelas").reset();
        muatDataTabel();
      } else {
        statusDiv.style.color = "red";
        statusDiv.innerText = "Gagal: " + response.message;
      }
    })
    .catch(err => {
      btn.disabled = false;
      statusDiv.style.color = "red";
      statusDiv.innerText = "Terjadi kesalahan: " + err;
    });
  });

  function muatDataTabel() {
    const loadingDiv = document.getElementById("loading");
    loadingDiv.style.display = "block";

    fetch(URL_APPS_SCRIPT)
      .then(res => res.json())
      .then(data => {
        loadingDiv.style.display = "none";
        const tbody = document.getElementById("tabelBody");
        tbody.innerHTML = "";

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="11" class="col-center">Belum ada data di Google Sheets.</td></tr>';
          return;
        }

        data.forEach((row, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="col-center">${index + 1}</td>
            <td><strong>${row.namaKelas}</strong></td>
            <td>${row.tingkat}</td>
            <td>${row.waliKelas}</td>
            <td>${row.guruPJOK}</td>
            <td>${row.guruPAI}</td>
            <td>${row.guruInggris}</td>
            <td class="col-center" style="color:#1d4ed8; font-weight:bold;">${row.jumlahL}</td>
            <td class="col-center" style="color:#be185d; font-weight:bold;">${row.jumlahP}</td>
            <td class="col-center"><strong>${row.totalSiswa}</strong></td>
            <td>${row.ruangKelas}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => {
        loadingDiv.innerText = "Gagal memuat data dari spreadsheet.";
      });
  }

  window.onload = muatDataTabel;
</script>

</body>
</html>
